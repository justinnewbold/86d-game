# EAS Build Workflow
# Builds iOS and Android apps using Expo Application Services
#
# Required Secrets:
# - EXPO_TOKEN: Your Expo access token (get from https://expo.dev/accounts/[account]/settings/access-tokens)
#
# Optional Secrets:
# - APPLE_ID: Apple ID for iOS submission
# - ASC_APP_ID: App Store Connect App ID
# - APPLE_TEAM_ID: Apple Developer Team ID

name: EAS Build

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: EAS Build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Check EAS credentials
        id: eas-auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EAS native build skipped because EXPO_TOKEN is not configured."
          fi

      - name: 🏗 Setup EAS
        if: steps.eas-auth.outputs.configured == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔍 Verify EAS CLI
        if: steps.eas-auth.outputs.configured == 'true'
        run: eas whoami

      - name: 🔧 Check/Initialize EAS Project
        if: steps.eas-auth.outputs.configured == 'true'
        id: eas-check
        run: |
          # Check if project has a valid projectId configured
          if grep -q '"projectId":' app.json && ! grep -q '"eas": *{}' app.json; then
            PROJECT_ID=$(grep -o '"projectId": *"[^"]*"' app.json | cut -d'"' -f4)
            if [ -n "$PROJECT_ID" ] && [ "$PROJECT_ID" != "" ]; then
              echo "Project configured with ID: $PROJECT_ID"
              echo "configured=true" >> $GITHUB_OUTPUT
            else
              echo "No valid project ID found"
              echo "configured=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Project not configured. Run 'eas init' locally to link your Expo account."
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Build app
        if: steps.eas-check.outputs.configured == 'true'
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"

          # For tags starting with 'v', use production profile
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            PROFILE="production"
          fi

          echo "Building for platform: $PLATFORM with profile: $PROFILE"

          if [ "$PLATFORM" = "all" ]; then
            eas build --platform all --profile $PROFILE --non-interactive
          else
            eas build --platform $PLATFORM --profile $PROFILE --non-interactive
          fi

      - name: ⚠️ EAS Build Skipped
        if: steps.eas-check.outputs.configured != 'true'
        run: |
          echo "::warning::EAS Build skipped - EXPO_TOKEN or EAS project ID is not configured."
          echo "To enable native builds, add EXPO_TOKEN as a repository secret, then run locally:"
          echo "  1. npm install -g eas-cli"
          echo "  2. eas login"
          echo "  3. eas init"
          echo "  4. git add app.json && git commit -m 'Add EAS project ID' && git push"

  # Web build job
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Build web
        run: npm run build:web

      - name: 📤 Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

  # Submit to app stores (only on production builds)
  submit:
    name: Submit to Stores
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📱 Submit to App Store
        run: eas submit --platform ios --latest --non-interactive
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}

      - name: 🤖 Submit to Play Store
        run: eas submit --platform android --latest --non-interactive
        continue-on-error: true
